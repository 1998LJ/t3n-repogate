name: CI

on:
  push:
    branches: [main, master, "refactor/*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js (for compatibility oracle testing)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Node reference verification test
        run: npm test

      - name: Run full Python test suite
        run: python -m unittest discover -s tests -v

  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist (isolated PEP 517)
        run: python -m build

      - name: Clean environment install and smoke test (No Node)
        run: |
          python -m venv /tmp/smoke_venv
          /tmp/smoke_venv/bin/pip install dist/*.whl
          /tmp/smoke_venv/bin/repogate --version
          /tmp/smoke_venv/bin/repogate --help
          
          # Run verify in a clean subshell without node in PATH
          env -i PATH="/tmp/smoke_venv/bin:/usr/bin:/bin" sh -c '
            if command -v node >/dev/null 2>&1; then
              echo "Error: node should not be in clean smoke PATH"
              exit 1
            fi
            repogate verify demo_reports/high_quality_clean_pr66.json demo_reports/high_quality_clean_pr66.proof.json
          '
