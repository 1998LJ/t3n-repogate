name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Check code formatting and static analysis
        run: |
          ruff check .
          ruff format --check .

  python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run Python unit and CLI test suite
        run: |
          python -m unittest discover -s tests -p "test_cli.py" -v
          python -m unittest discover -s tests -p "test_engine.py" -v

  node-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          npm ci
          pip install .
      - name: Run Node reference verification test
        run: npm test
      - name: Run Cross-Implementation contract parity tests
        run: python -m unittest discover -s tests -p "test_cross_verification.py" -v

  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel and sdist artifact integrity
        run: |
          echo "=== Auditing Wheel Contents ==="
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep "repogate/data/agent_identity.json"
          ! unzip -l dist/*.whl | grep -E "node_modules|\.secret|\.pem|private.*key"
          echo "=== Auditing Sdist Contents ==="
          tar -tzf dist/*.tar.gz
          ! tar -tzf dist/*.tar.gz | grep -E "node_modules|\.secret|\.pem|private.*key"
      - name: Install and smoke test wheel in clean environment without Node
        run: |
          python -m venv /tmp/smoke_venv
          /tmp/smoke_venv/bin/pip install dist/*.whl
          /tmp/smoke_venv/bin/pip check

          REPORT="$GITHUB_WORKSPACE/demo_reports/high_quality_clean_pr66.json"
          PROOF="$GITHUB_WORKSPACE/demo_reports/high_quality_clean_pr66.proof.json"

          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"

          echo "Testing repogate CLI outside repo in isolated environment..."
          /tmp/smoke_venv/bin/repogate --version
          /tmp/smoke_venv/bin/repogate --help

          echo "Running native verification without Node in PATH..."
          env -i \
            PATH="/tmp/smoke_venv/bin:/usr/bin:/bin" \
            REPORT="$REPORT" \
            PROOF="$PROOF" \
            sh -c '
              command -v node && exit 99 || true
              repogate verify "$REPORT" "$PROOF"
            '
