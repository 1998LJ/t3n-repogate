name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-build:
    name: Build and Validate Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify version and tag contract
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PROJECT_VERSION=$(python3 -c 'import tomllib; f=open("pyproject.toml", "rb"); print(tomllib.load(f)["project"]["version"])')
          echo "Tag: ${TAG_NAME}, Package version: ${PROJECT_VERSION}"
          if [[ "v${PROJECT_VERSION}" != "${TAG_NAME}" ]]; then
            echo "ERROR: Tag name does not match project version! Expected v${PROJECT_VERSION}, got ${TAG_NAME}"
            exit 1
          fi
          if [[ "${PROJECT_VERSION}" =~ (dev|a|b|rc) ]]; then
            echo "ERROR: Pre-release or dev version detected in production release: ${PROJECT_VERSION}"
            exit 1
          fi
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Audit artifact contents
        run: |
          unzip -l dist/*.whl | grep "repogate/data/agent_identity.json"
          if unzip -l dist/*.whl | grep -E "node_modules/|\.secret|private.*key|\.pem"; then
            echo "ERROR: Forbidden files detected in wheel"
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -E "node_modules/|\.secret|private.*key|\.pem"; then
            echo "ERROR: Forbidden files detected in sdist"
            exit 1
          fi
      - name: Clean install and smoke test
        run: |
          python -m venv /tmp/smoke_venv
          /tmp/smoke_venv/bin/pip install dist/*.whl
          /tmp/smoke_venv/bin/pip check
          INSTALLED_VERSION=$(/tmp/smoke_venv/bin/repogate --version)
          PROJECT_VERSION=$(python3 -c 'import tomllib; f=open("pyproject.toml", "rb"); print(tomllib.load(f)["project"]["version"])')
          echo "Installed CLI: ${INSTALLED_VERSION}"
          if [[ "${INSTALLED_VERSION}" != "repogate ${PROJECT_VERSION}" ]]; then
            echo "ERROR: Installed CLI version mismatch!"
            exit 1
          fi
      - name: Prepare immutable release bundle
        run: |
          mkdir -p release-bundle/dists
          cp dist/*.whl release-bundle/dists/
          cp dist/*.tar.gz release-bundle/dists/
          (
            cd release-bundle/dists
            sha256sum * > ../SHA256SUMS
          )
          cat release-bundle/SHA256SUMS
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release-bundle/
          if-no-files-found: error

  provenance:
    name: Generate GitHub Build Provenance
    needs: [release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle/
      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-bundle/dists/*.whl
            release-bundle/dists/*.tar.gz

  pypi-publish:
    name: Publish to PyPI via Trusted Publishing
    needs: [release-build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/t3n-repogate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle/
      - name: Assert clean PyPI distribution directory
        shell: bash
        run: |
          find release-bundle/dists -maxdepth 1 -type f -printf '%f\n'
          test "$(find release-bundle/dists -maxdepth 1 -type f | wc -l)" -eq 2
          if find release-bundle/dists -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz' | grep -q .; then
            echo "Unexpected non-distribution file in PyPI publish directory"
            exit 1
          fi
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-bundle/dists/

  github-release:
    name: Create GitHub Release
    needs: [release-build, provenance, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release-bundle/
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release-bundle/dists/*.whl \
            release-bundle/dists/*.tar.gz \
            release-bundle/SHA256SUMS \
            --title "RepoGate $TAG_NAME" \
            --generate-notes
