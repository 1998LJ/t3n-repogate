name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-build:
    name: Build and Validate Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify version and tag contract
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PROJECT_VERSION=$(python3 -c 'import tomllib; f=open("pyproject.toml", "rb"); print(tomllib.load(f)["project"]["version"])')
          echo "Tag: ${TAG_NAME}, Package version: ${PROJECT_VERSION}"
          if [[ "v${PROJECT_VERSION}" != "${TAG_NAME}" ]]; then
            echo "ERROR: Tag name does not match project version! Expected v${PROJECT_VERSION}, got ${TAG_NAME}"
            exit 1
          fi
          if [[ "${PROJECT_VERSION}" =~ (dev|a|b|rc) ]]; then
            echo "ERROR: Pre-release or dev version detected in production release: ${PROJECT_VERSION}"
            exit 1
          fi
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Audit artifact contents
        run: |
          unzip -l dist/*.whl | grep "repogate/data/agent_identity.json"
          if unzip -l dist/*.whl | grep -E "node_modules/|\.secret|private.*key|\.pem"; then
            echo "ERROR: Forbidden files detected in wheel"
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -E "node_modules/|\.secret|private.*key|\.pem"; then
            echo "ERROR: Forbidden files detected in sdist"
            exit 1
          fi
      - name: Clean install and smoke test
        run: |
          python -m venv /tmp/smoke_venv
          /tmp/smoke_venv/bin/pip install dist/*.whl
          /tmp/smoke_venv/bin/pip check
          INSTALLED_VERSION=$(/tmp/smoke_venv/bin/repogate --version)
          PROJECT_VERSION=$(python3 -c 'import tomllib; f=open("pyproject.toml", "rb"); print(tomllib.load(f)["project"]["version"])')
          echo "Installed CLI: ${INSTALLED_VERSION}"
          if [[ "${INSTALLED_VERSION}" != "repogate ${PROJECT_VERSION}" ]]; then
            echo "ERROR: Installed CLI version mismatch!"
            exit 1
          fi
      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload release distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  provenance:
    name: Generate GitHub Build Provenance
    needs: [release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - name: Generate build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/t3n_repogate-*'

  pypi-publish:
    name: Publish to PyPI via Trusted Publishing
    needs: [release-build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/t3n-repogate
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: [release-build, provenance, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist/
      - name: Create Release via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          gh release create "${TAG_NAME}" dist/*             --title "RepoGate ${TAG_NAME}"             --generate-notes
