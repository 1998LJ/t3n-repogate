name: TestPyPI Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testpypi-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Audit artifact contents
        run: |
          unzip -l dist/*.whl | grep "repogate/data/agent_identity.json"
          if unzip -l dist/*.whl | grep -E "node_modules/|\.secret|private.*key|\.pem"; then
            echo "ERROR: Forbidden files detected in wheel"
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -E "node_modules/|\.secret|private.*key|\.pem"; then
            echo "ERROR: Forbidden files detected in sdist"
            exit 1
          fi
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testpypi-dist
          path: dist/
          if-no-files-found: error

  testpypi-publish:
    name: Publish to TestPyPI
    needs: [testpypi-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/t3n-repogate
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: testpypi-dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
