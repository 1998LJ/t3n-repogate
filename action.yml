name: "RepoGate PR Quality Gate"
description: "Autonomous PR Quality, Anti-Tamper & Cryptographic Attestation Gate Agent"
author: "1998LJ"

branding:
  icon: "shield"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token used for read-only PR and API inspection"
    required: true

  pr-url:
    description: "Pull request URL; auto-detected on pull_request events when omitted"
    required: false
    default: ""

  fail-on-block:
    description: "Fail the Action when RepoGate marks the PR BLOCKED"
    required: false
    default: "true"

  python-version:
    description: "Python runtime used by RepoGate"
    required: false
    default: "3.12"

  report-path:
    description: "Optional destination path for the generated RepoGate JSON report"
    required: false
    default: ""

outputs:
  risk-score:
    description: "RepoGate numerical risk score (0..100)"
    value: ${{ steps.audit.outputs.risk-score }}

  merge-readiness:
    description: "Merge readiness assessment (READY / BLOCKED)"
    value: ${{ steps.audit.outputs.merge-readiness }}

  recommended-action:
    description: "RepoGate recommended action (MERGE_READY, FIX_REQUIRED, etc.)"
    value: ${{ steps.audit.outputs.recommended-action }}

  target:
    description: "Audit target identifier (owner/repo#123)"
    value: ${{ steps.audit.outputs.target }}

  report-path:
    description: "Absolute path to the generated JSON report"
    value: ${{ steps.audit.outputs.report-path }}

  audit-exit-code:
    description: "RepoGate CLI original exit code (0=READY, 1=BLOCKED, 2=Error)"
    value: ${{ steps.audit.outputs.audit-exit-code }}

runs:
  using: "composite"
  steps:
    - name: Set up Python runtime
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install RepoGate from Action Source
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ github.action_path }}"

    - name: Run RepoGate PR Quality Audit
      id: audit
      shell: bash
      env:
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_PR-URL: ${{ inputs.pr-url }}
        INPUT_FAIL-ON-BLOCK: ${{ inputs.fail-on-block }}
        INPUT_REPORT-PATH: ${{ inputs.report-path }}
      run: |
        python -m repogate.action_adapter
